# Reproducible baseline: pretrained EfficientNet-B0 + Cross-Entropy.

seed: 42
deterministic: true
device: auto

data:
  image_root: data/raw
  image_size: 224
  batch_size: 16
  num_workers: 0
  split_dir: data/splits
  split: random
  horizontal_flip: true
  rotation_degrees: 10

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 10

training:
  epochs: 30
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: cross_entropy
  scheduler: cosine
  early_stopping_patience: 7

evaluation:
  primary_metric: f1_macro

output:
  checkpoint_dir: experiments/runs/baseline_v2
