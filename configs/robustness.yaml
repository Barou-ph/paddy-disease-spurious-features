# Robustness evaluation should reuse the trained baseline/proposed checkpoints.
# Do not retrain on the evaluation subsets unless the experiment explicitly
# defines a new training condition.

seed: 42
deterministic: true
device: auto

data:
  image_root: data/raw
  image_size: 224
  batch_size: 32
  num_workers: 4
  image_root: data/raw/paddy-disease-classification/train_images
  split_dir: data/splits
  split: random  # random | variety | age_old | age_young -- see data/README.md

model:
  name: efficientnet_b0
  pretrained: true
  num_classes: 10

evaluation:
  primary_metric: f1_macro

output:
  checkpoint_dir: experiments/runs/robustness
